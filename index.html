
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>3D Negatif Yük - Kesin Ok Ucu</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      .a-enter-vr { display: none !important; }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">

      <a-marker preset="hiro">
        <a-entity id="physics-model" position="0 0.4 0">

          <!-- Negatif yüklü mavi küre -->
          <a-sphere
            radius="0.08"
            color="#0000FF"
            material="shader: flat;">
          </a-sphere>

          <!-- Görünür negatif yük işareti -->
          <a-text
            value="-"
            position="0 0.18 0"
            rotation="-90 0 0"
            align="center"
            color="#FFFFFF"
            width="4"
            scale="3 3 3"
            side="double">
          </a-text>

          <!-- Negatif yük açıklaması -->
          <a-text
            value="NEGATIF YUK"
            position="0 0.28 0"
            rotation="-90 0 0"
            align="center"
            color="#FFFFFF"
            width="2"
            scale="1.5 1.5 1.5"
            side="double">
          </a-text>

          <a-entity id="field-lines"></a-entity>

        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.onload = () => {
        const container = document.querySelector('#field-lines');
        const numVectors = 20;
        const fieldLength = 3;

        for (let i = 0; i < numVectors; i++) {
          let y = 1 - (i / (numVectors - 1)) * 2;
          let rAtY = Math.sqrt(1 - y * y);
          let goldenAngle = Math.PI * (3 - Math.sqrt(5));
          let theta = goldenAngle * i;

          let x = Math.cos(theta) * rAtY;
          let z = Math.sin(theta) * rAtY;

          let dir = new THREE.Vector3(x, y, z).normalize();
          let vectorGroup = document.createElement('a-entity');

          // 1. UZUN VE KESİNTİSİZ ÇİZGİ
          let line = document.createElement('a-cylinder');
          line.setAttribute('radius', '0.002');
          line.setAttribute('height', fieldLength);
          line.setAttribute('color', '#FFD700');
          line.setAttribute('material', 'shader: flat;');
          line.setAttribute('position', {
            x: 0,
            y: fieldLength / 2,
            z: 0
          });

          // 2. OK BAŞI
          let arrowHead = document.createElement('a-cone');

          arrowHead.setAttribute('radius-bottom', '0.025');
          arrowHead.setAttribute('radius-top', '0');
          arrowHead.setAttribute('height', '0.12');
          arrowHead.setAttribute('color', '#FFD700');
          arrowHead.setAttribute('material', 'shader: flat;');

          arrowHead.setAttribute('position', {
            x: 0,
            y: fieldLength / 2,
            z: 0
          });

          arrowHead.setAttribute('rotation', '180 0 0');

          vectorGroup.appendChild(line);
          vectorGroup.appendChild(arrowHead);
          container.appendChild(vectorGroup);

          let lookAtPos = dir.clone().multiplyScalar(2);

          vectorGroup.addEventListener('loaded', () => {
            vectorGroup.object3D.lookAt(lookAtPos);
            vectorGroup.object3D.rotateX(Math.PI / 2);
          });
        }
      };
    </script>
  </body>
</html>
